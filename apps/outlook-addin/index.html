    <meta charset="UTF-8" />

    <title>Rhud · New opportunity</title>
    <!--
      Office.js is loaded from Microsoft's CDN per Office Add-in policy —
      bundling our own copy is explicitly not supported (Outlook expects
      the CDN script so it can match versions to the host). The React app
      waits for Office.onReady() in main.tsx before touching the mailbox.
    -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

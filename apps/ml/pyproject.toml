[project]
name = "rhud-ml"
version = "0.0.0"
description = "Rhud ML service — per-tenant price prediction (XGBoost)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "numpy>=2.1",
    "pandas>=2.2",
    "boto3>=1.35",
    "sentence-transformers>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rhud_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# sklearn / xgboost / boto3 ship without typed stubs out of the box.
# Drop strict-mode noise from those imports rather than vendor stubs.
module = ["sklearn.*", "xgboost.*", "boto3.*", "botocore.*", "joblib.*"]
ignore_missing_imports = true

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: lint · typecheck · test (node)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhud
          POSTGRES_PASSWORD: rhud
          POSTGRES_DB: rhud
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rhud -d rhud"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://rhud:rhud@localhost:5432/rhud?schema=public
      # The runtime DB role. NOBYPASSRLS — required for tenant isolation to
      # actually enforce. If you only set DATABASE_URL the API will run as
      # superuser and silently bypass every RLS policy. Both must be set.
      APP_DATABASE_URL: postgresql://rhud_app:rhud_app@localhost:5432/rhud?schema=public
      JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install --frozen-lockfile

      # Apply init SQL + Prisma migrations before running RLS tests.
      - name: Apply infra init SQL
        run: psql "$DATABASE_URL" -f infra/postgres/init/01-extensions.sql
      - name: Apply Prisma migrations
        working-directory: apps/api
        run: pnpm prisma:migrate:deploy

      - run: pnpm --filter @rhud/shared build
      - run: pnpm -r --parallel run lint
      - run: pnpm -r --parallel run typecheck
      - run: pnpm --filter @rhud/api test

  python:
    name: lint · typecheck (python ml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e 'apps/ml[dev]'
      - run: ruff check apps/ml
      - run: mypy apps/ml/rhud_ml

  e2e:
    name: e2e · Playwright (web smoke)
    runs-on: ubuntu-latest
    needs: [node]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhud
          POSTGRES_PASSWORD: rhud
          POSTGRES_DB: rhud
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rhud -d rhud"
          --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        image: minio/minio:RELEASE.2024-01-16T16-07-38Z
        env:
          MINIO_ROOT_USER: rhud
          MINIO_ROOT_PASSWORD: rhud-secret
        ports: ['9000:9000']
        # No --health-cmd here — Playwright tests don't currently exercise
        # S3 uploads end-to-end; the only specs that would are partner
        # intake with attachments, which the smoke layer skips.
    env:
      DATABASE_URL: postgresql://rhud:rhud@localhost:5432/rhud?schema=public
      APP_DATABASE_URL: postgresql://rhud_app:rhud_app@localhost:5432/rhud?schema=public
      JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      NODE_ENV: test
      EMAIL_PROVIDER: console
      # CI Playwright runs the browser on the host; signed S3 URLs the
      # API mints must be reachable from there. Use localhost so we
      # don't end up with `minio:9000` URLs the host can't resolve.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: rhud
      S3_SECRET_KEY: rhud-secret
      S3_BUCKET: rhud-dev
      # Cosmetic — surface the right inbound domain in the partner-token
      # banner if any spec hits it.
      NEXT_PUBLIC_INBOUND_EMAIL_DOMAIN: inbound.rhud.net
      NEXT_PUBLIC_PARTNER_INTAKE_BASE_URL: http://localhost:8000
      E2E_API_URL: http://localhost:8000
      E2E_WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install --frozen-lockfile

      - name: Apply infra init SQL
        run: psql "$DATABASE_URL" -f infra/postgres/init/01-extensions.sql
      - name: Apply Prisma migrations
        working-directory: apps/api
        run: pnpm prisma:migrate:deploy
      - name: Seed dev data
        working-directory: apps/api
        run: pnpm seed
      - run: pnpm --filter @rhud/shared build
      - run: pnpm --filter @rhud/api build
      - run: pnpm --filter @rhud/web build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Start API
        run: pnpm --filter @rhud/api start &
      - name: Wait for API health
        run: |
          for i in {1..60}; do
            curl -fsSL http://localhost:8000/api/v1/health && exit 0 || sleep 1
          done; exit 1

      - name: Start Web
        run: pnpm --filter @rhud/web start &
      - name: Wait for Web ready
        run: |
          for i in {1..60}; do
            curl -fsSL http://localhost:3000/login && exit 0 || sleep 1
          done; exit 1

      - name: Playwright tests
        working-directory: apps/web
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
